        - generic [ref=e1510]:
          - button "Is Commit a coding tutorial platform?" [ref=e1511]:
            - generic [ref=e1512]: Is Commit a coding tutorial platform?
            - img [ref=e1513]
          - paragraph [ref=e1515]: "No. Commit doesn't teach you to code — it helps you learn better while you do. Think of it as infrastructure around your learning: structured sessions, retention tools, and a record of your growth. Bring your own resources."
        - generic [ref=e1516]:
          - button "How is this different from Notion or Obsidian?" [ref=e1517]:
            - generic [ref=e1518]: How is this different from Notion or Obsidian?
            - img [ref=e1519]
          - paragraph [ref=e1521]: "Notion and Obsidian are blank canvases. Commit is purpose-built for developer learning workflows: a Pomodoro timer that ends with a structured prompt, SM-2 flashcard scheduling, concept mastery tracking, and a bug journal — all connected."
        - generic [ref=e1522]:
          - button "Do I need to use the Pomodoro technique?" [ref=e1523]:
            - generic [ref=e1524]: Do I need to use the Pomodoro technique?
            - img [ref=e1525]
          - paragraph [ref=e1527]: It helps, but it's not required. The 25-minute session is the default trigger for the Commit Prompt and TIL log. You can adjust session length to match your flow.
        - generic [ref=e1528]:
          - button "How does spaced repetition work?" [ref=e1529]:
            - generic [ref=e1530]: How does spaced repetition work?
            - img [ref=e1531]
          - paragraph [ref=e1533]: Commit uses the SM-2 algorithm — the same one behind Anki — to schedule flashcard reviews. Rate each card after review and the algorithm calculates the optimal next review date based on your confidence.
        - generic [ref=e1534]:
          - button "What AI features are included?" [ref=e1535]:
            - generic [ref=e1536]: What AI features are included?
            - img [ref=e1537]
          - paragraph [ref=e1539]: Pro tier includes the AI Code Explainer powered by Claude. Paste any code, choose a depth level (5-year-old to senior dev), and get a plain-language explanation designed for learning, not just debugging.
        - generic [ref=e1540]:
          - button "Is the free tier truly free?" [ref=e1541]:
            - generic [ref=e1542]: Is the free tier truly free?
            - img [ref=e1543]
          - paragraph [ref=e1545]: Yes. No credit card required. Free includes unlimited Pomodoro sessions, TIL logging, flashcards, and up to 3 roadmaps. Upgrade to Pro for AI features, unlimited roadmaps, and advanced analytics.
